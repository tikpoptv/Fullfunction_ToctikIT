name: CI & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh
          bash deploy/tests/test_deploy_stub.sh

      - name: Install & Test Backend (Prisma Migrate + Seed + Vitest)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
        run: |
          npm ci
          npx prisma migrate deploy
          npm run prisma:seed
          npm test

      - name: Install, Test & Build Frontend (Vitest + Production Build)
        working-directory: ./client
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify Unified Production Dockerfile Build
        run: |
          docker build -t toktickit-lab4:latest .
