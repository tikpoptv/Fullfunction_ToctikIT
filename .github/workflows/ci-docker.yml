name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      - name: Install & Test Backend (Prisma Migrate + Seed + Vitest)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
        run: |
          npm ci
          npx prisma migrate deploy
          npm run prisma:seed
          npm test

      - name: Install, Test & Build Frontend (Vitest + Production Build)
        working-directory: ./client
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify Unified Production Dockerfile Build
        run: |
          docker build -t toktickit-lab4:latest .
